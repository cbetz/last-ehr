name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork-safe: pull_request (not pull_request_target), no secrets used.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify the installable MCP tarball
        run: npm run mcp:pack:check

  hosted-work-image:
    name: Hosted synthetic Work image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone Work image
        run: docker build -f Dockerfile.work -t lastehr-work:ci .
      - name: Verify runtime entry point and private volume ownership
        run: |
          docker run --rm lastehr-work:ci node --import tsx scripts/work-hosted.ts --help
          docker run --rm --entrypoint node lastehr-work:ci -e '
            const fs = require("node:fs");
            if (process.getuid() !== 1000) process.exit(1);
            for (const path of ["/var/lib/lastehr-work", "/var/lib/lastehr-work/store"]) {
              const stat = fs.statSync(path);
              if (stat.uid !== process.getuid() || (stat.mode & 0o777) !== 0o700) process.exit(1);
            }
          '
      - name: Boot the bounded hosted stack with private synthetic storage
        run: |
          python3 - <<'PY'
          import json, os
          with open('work-hosted.example.json') as source:
              config = json.load(source)
          descriptor = os.open('work-hosted.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as target:
              json.dump(config, target)
          PY
          sudo chown 1000:1000 work-hosted.json
          cat > /tmp/hosted-work-ci.yml <<'YAML'
          services:
            work:
              image: lastehr-work:ci
          YAML
          docker compose -p lastehr-hosted-ci -f docker-compose.work.yml -f /tmp/hosted-work-ci.yml up -d --no-build
          for attempt in $(seq 1 90); do
            if curl --fail --silent --connect-timeout 1 --max-time 2 --header 'Host: work.example.org' http://127.0.0.1:3400/health > /tmp/hosted-work-health.json; then
              jq -e '.status == "ready" and .mode == "synthetic-only"' /tmp/hosted-work-health.json
              break
            fi
            if [ "$attempt" -eq 90 ]; then exit 1; fi
            sleep 4
          done
          curl --fail --silent --connect-timeout 1 --max-time 2 --header 'Host: work.example.org' http://127.0.0.1:3400/.well-known/oauth-protected-resource/mcp | jq -e '.resource == "https://work.example.org/mcp"'
          test "$(curl --silent --connect-timeout 1 --max-time 2 --output /dev/null --write-out '%{http_code}' --header 'Host: work.example.org' http://127.0.0.1:3400/mcp)" = 401
          for service in work hapi postgres; do
            container=$(docker compose -p lastehr-hosted-ci -f docker-compose.work.yml -f /tmp/hosted-work-ci.yml ps -q "$service")
            docker inspect --format '{{.Name}} memory={{.HostConfig.Memory}} oomKilled={{.State.OOMKilled}}' "$container"
            expected_memory=1073741824
            if [ "$service" = hapi ]; then expected_memory=3221225472; fi
            test "$(docker inspect --format '{{.HostConfig.Memory}}' "$container")" = "$expected_memory"
            test "$(docker inspect --format '{{.State.OOMKilled}}' "$container")" = false
            test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
          done
          docker compose -p lastehr-hosted-ci -f docker-compose.work.yml -f /tmp/hosted-work-ci.yml restart work
          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 1 --max-time 2 --header 'Host: work.example.org' http://127.0.0.1:3400/health > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done
      - name: Show hosted stack logs on failure
        if: failure()
        run: docker compose -p lastehr-hosted-ci -f docker-compose.work.yml logs --no-color --tail=100
      - name: Stop the disposable hosted CI stack
        if: always()
        run: docker compose -p lastehr-hosted-ci -f docker-compose.work.yml down --volumes --remove-orphans

  local-hapi:
    name: Local scripted HAPI quickstart
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FHIR_BACKEND: hapi
      FHIR_BASE_URL: http://localhost:8080/fhir
      AI_PROVIDER: scripted
      LASTEHR_SCRIPTED_DEMO: "true"
      NEXT_PUBLIC_QUICKSTART: "true"
      NEXT_PUBLIC_SCRIPTED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci
      - name: Prepare the zero-key local demo
        run: npm run demo:local:prepare
      - name: Verify seeded patient search
        run: >-
          curl --fail --silent --show-error
          'http://localhost:8080/fhir/Patient?name=Smith&_count=20'
          | jq -e '([.entry[]?.resource | select(.resourceType == "Patient")] | length) >= 2'
      - name: Verify the read-only MCP connection diagnostic
        run: |
          npm run mcp:build
          node packages/mcp/dist/cli.js doctor --connect
      - name: Verify zero-credential HAPI MCP Local Lab
        env:
          RUN_HAPI_E2E: "1"
        run: npm test -- scripts/mcp-demo.hapi.integration.test.ts packages/mcp/src/hapi.integration.test.ts packages/mcp/src/write-tools.hapi.integration.test.ts
      - name: Run FHIR Agent Safety Eval
        run: >-
          npm run eval -- --no-prepare
          --report artifacts/fhir-agent-safety-eval.json
      - name: Upload FHIR Agent Safety Eval report
        uses: actions/upload-artifact@v4
        with:
          name: fhir-agent-safety-eval
          path: artifacts/fhir-agent-safety-eval.json
          if-no-files-found: error
      # Dogfood: the reference implementation must pass its own protocol
      # conformance suite, strict mode (AIAST + Provenance included), on
      # every pull request and merge.
      - name: Run agent-write conformance suite against @lastehr/mcp
        env:
          LASTEHR_MCP_WRITES: proposal
          LASTEHR_WRITE_PROVENANCE: "true"
          HAPI_BASE_URL: http://localhost:8080/fhir
        run: |
          npm run build --workspace @lastehr/mcp
          npm run build --workspace @lastehr/agent-write-conformance
          node packages/conformance/dist/cli.js \
            --server "node packages/mcp/dist/cli.js" \
            --manifest packages/conformance/examples/lastehr-mcp.awp-manifest.json \
            --fhir-base-url http://localhost:8080/fhir \
            --confirm-synthetic --strict \
            --report artifacts/awp-conformance.json
      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: awp-conformance
          path: artifacts/awp-conformance.json
          if-no-files-found: error
      - name: Verify scripted approval flow against HAPI
        env:
          RUN_HAPI_E2E: "1"
        run: >-
          npm test --
          lib/fhir/hapi.contract.integration.test.ts
          lib/ai/scripted-demo.hapi.integration.test.ts
          lib/ai/coded-read.hapi.integration.test.ts
      - name: Verify durable work persistence and recovery against HAPI
        env:
          RUN_HAPI_E2E: "1"
        run: >-
          npm test --
          scripts/work-demo-fhir.hapi.integration.test.ts
          scripts/work-demo.restart.hapi.integration.test.ts
          scripts/work-mcp.hapi.integration.test.ts
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser approval-flow e2e
        env:
          RATE_LIMIT_PER_IP_MAX: "100"
        run: npm run test:e2e
      - name: Run durable synthetic work browser e2e
        run: npm run test:work:e2e
      - name: Upload synthetic work browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-work-lab
          path: |
            artifacts/work-lab/*.png
            artifacts/work-lab/hosted-work-browser.json
          if-no-files-found: error
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - name: Show local stack logs on failure
        if: failure()
        run: docker compose logs --no-color hapi postgres
      - name: Stop local FHIR stack
        if: always()
        run: docker compose down --volumes --remove-orphans
