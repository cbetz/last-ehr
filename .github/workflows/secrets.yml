name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            gitleaks.tar.gz | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all fetched history without contacting credential providers
        shell: bash
        run: |
          set -euo pipefail
          # Use built-in rules without repository allowlists or inline exemptions.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          touch "$RUNNER_TEMP/gitleaks.ignore"
          "$RUNNER_TEMP/gitleaks" git . \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks.ignore" \
            --ignore-gitleaks-allow \
            --log-opts="--all --full-history --diff-merges=separate --no-ext-diff --no-textconv" \
            --max-archive-depth=2 \
            --redact=100 --no-banner --no-color
