name: Publish MCP Registry metadata

on:
  workflow_dispatch:

# This workflow publishes metadata only. npm packages are released separately,
# then this workflow verifies the exact immutable npm version in server.json.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @lastehr/mcp metadata
    if: github.repository == 'cbetz/last-ehr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the official MCP Registry publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            -o mcp-publisher.tar.gz
          printf '%s  mcp-publisher.tar.gz\n' "$MCP_PUBLISHER_SHA256" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish the verified registry record
        run: ./mcp-publisher publish packages/mcp/server.json
