# Dedicated synthetic hosted Work stack. Terminate HTTPS at a separate ingress
# proxy pointed at 127.0.0.1:3400; never publish HAPI or Postgres ports.
services:
  work:
    build:
      context: .
      dockerfile: Dockerfile.work
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3400:3400"
    volumes:
      - type: bind
        source: ./work-hosted.json
        target: /run/secrets/work-hosted.json
        read_only: true
        bind:
          create_host_path: false
      - work-store:/var/lib/lastehr-work
    depends_on:
      hapi:
        condition: service_started
    networks:
      - work-private
      - work-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    stop_grace_period: 30s
    deploy:
      replicas: 1
  hapi:
    image: hapiproject/hapi:v8.10.0-2
    restart: unless-stopped
    volumes:
      - ./docker/hapi.application.yaml:/app/config/application.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - work-private
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    volumes:
      - work-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - work-private
networks:
  work-private:
    internal: true
  # Only Work needs outbound HTTPS for the configured identity provider.
  work-egress:
volumes:
  work-store:
  work-postgres:
